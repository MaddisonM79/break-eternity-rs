[package]
name = "break-eternity-rs"
version = "0.5.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "Fork of break-eternity: a numerical library to represent numbers as large as 10^^1e308 and as 'small' as 10^-(10^^1e308)."
authors = ["MaddisonM79", "cozyGalvinism <jean@der-capta.in>"]
repository = "https://github.com/MaddisonM79/break-eternity-rs"
homepage = "https://github.com/MaddisonM79/break-eternity-rs"
documentation = "https://docs.rs/break-eternity-rs"
keywords = ["big", "decimal", "bigdecimal", "incremental", "games"]
categories = ["game-development", "mathematics"]
readme = "README.md"
exclude = [".gitignore", ".vscode", ".github", "docs", "deny.toml"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "break_eternity"

[dependencies]
thiserror = { version = "2", default-features = false }
libm = { version = "0.2", optional = true }
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }
proptest = { version = "1", optional = true, default-features = false, features = ["std"] }
godot = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
bincode = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# proptest and criterion pull in getrandom, which has no default wasm32 backend.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1"
criterion = { version = "0.8", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "ops"
harness = false

[features]
default = ["std"]
# Use the standard library. Disable it (and enable `libm`) for `no_std` targets;
# `alloc` is always required for formatting and parsing.
std = ["thiserror/std", "serde?/std"]
# Pure-Rust float math for `no_std` builds. Ignored when `std` is enabled.
libm = ["dep:libm"]
# `Serialize` / `Deserialize` for `Decimal` (string form by default; see `serde_components`).
serde = ["dep:serde"]
# `proptest::Arbitrary` for `Decimal` and the strategies in `break_eternity::strategy`.
proptest = ["std", "dep:proptest"]
# Godot 4 via gdext.
godot4 = ["std", "dep:godot"]
# Exposes Decimal to JavaScript via wasm-bindgen.
wasm = ["std", "dep:wasm-bindgen", "dep:js-sys"]
