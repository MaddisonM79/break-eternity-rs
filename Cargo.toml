[package]
name = "break-eternity-rs"
version = "0.5.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
description = "Fork of break-eternity: a numerical library to represent numbers as large as 10^^1e308 and as 'small' as 10^-(10^^1e308)."
authors = ["MaddisonM79", "cozyGalvinism <jean@der-capta.in>"]
repository = "https://github.com/MaddisonM79/break-eternity-rs"
homepage = "https://github.com/MaddisonM79/break-eternity-rs"
documentation = "https://docs.rs/break-eternity-rs"
keywords = ["big", "decimal", "bigdecimal", "incremental", "games"]
categories = ["game-development", "mathematics"]
readme = "README.md"
exclude = [".gitignore", ".vscode", ".github"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "break_eternity"

[dependencies]
thiserror = "2"
serde = { version = "1", optional = true }
godot = { version = "0.5", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
criterion = { version = "0.8", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[[bench]]
name = "ops"
harness = false

[features]
default = []
# Godot 4 via gdext.
godot4 = ["dep:godot"]
# Exposes Decimal to JavaScript via wasm-bindgen.
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
